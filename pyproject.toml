[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcheesbench"
version = "0.1.0"
description = "A chess LLM benchmark scored against a local UCI master engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Homer Quan" }]
dependencies = ["python-chess>=1.999"]
keywords = ["chess", "benchmark", "llm", "stockfish", "uci", "engine", "centipawn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Homepage = "https://github.com/homerquan/LLMChessBench"
Repository = "https://github.com/homerquan/LLMChessBench"
Issues = "https://github.com/homerquan/LLMChessBench/issues"

[project.scripts]
llmcheesbench = "llmcheesbench.cli:run_cli"
chessbench = "llmcheesbench.cli:run_cli"

[tool.setuptools]
packages = ["llmcheesbench"]
